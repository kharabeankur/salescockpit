# CI/CD for the streaming_framework Databricks Asset Bundle
#
#   pull request → unit tests + bundle validate (dev and prod)
#   push to main → deploy to prod (gated by the "prod" GitHub environment)
#   manual       → deploy to the target you pick
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DATABRICKS_HOST            https://<workspace>.azuredatabricks.net
#   DATABRICKS_CLIENT_ID       service principal application id   (OAuth M2M, recommended)
#   DATABRICKS_CLIENT_SECRET   service principal OAuth secret
#   (or DATABRICKS_TOKEN instead — see the env block below)

name: streaming_framework bundle

on:
  pull_request:
    paths:
      - "streaming_framework/**"
      - ".github/workflows/streaming_framework_bundle.yml"
  push:
    branches: [main]
    paths:
      - "streaming_framework/**"
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: streaming-framework-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: streaming_framework

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  # Using a personal access token instead? Replace the two CLIENT lines with:
  # DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main

      - name: Unit tests
        run: uv run --python 3.11 --extra dev pytest -q

      - name: Validate (dev)
        run: databricks bundle validate -t dev

      - name: Validate (prod)
        run: databricks bundle validate -t prod

  deploy:
    needs: test-and-validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main

      - name: Deploy
        run: databricks bundle deploy -t ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }}
